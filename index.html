<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日一候选</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 12px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(480px, 96vw);
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 12px 48px rgba(0,0,0,.08);
    overflow: hidden;
    padding-bottom: 28px;
  }

  /* 封面图 */
  .cover { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; }
  .cover.hidden { display: none; }

  .body { padding: 22px 24px 0; }

  .title { font-size: 24px; font-weight: 700; letter-spacing: .5px; color: #1d1d1f; }
  .subtitle { margin-top: 3px; font-size: 13px; color: #86868b; }

  /* 数据条 */
  .stats { display: flex; gap: 8px; margin: 18px 0 14px; }
  .stat {
    flex: 1; text-align: center;
    background: #f5f5f7; border: 1px solid #e8e8ed;
    border-radius: 14px; padding: 10px 4px;
  }
  .stat .num { font-size: 21px; font-weight: 700; color: #1d1d1f; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: 11px; color: #86868b; margin-top: 2px; }

  /* 抽奖舞台 */
  .stage {
    display: flex; align-items: center; justify-content: center;
    min-height: 120px;
    background: #fafafc; border: 1px solid #e8e8ed;
    border-radius: 18px; padding: 16px 12px;
  }
  .name {
    font-size: 46px; font-weight: 700; letter-spacing: .5px; color: #1d1d1f;
    line-height: 1.15; word-break: break-all; text-align: center;
    transition: color .15s;
  }
  .name.rolling { color: #1d1d1f; opacity: .85; }
  .name.locked { color: #0071e3; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

  /* 10 秒倒计时 */
  .cd { height: 3px; border-radius: 2px; background: #e8e8ed; margin: 10px 0 2px; overflow: hidden; }
  .cd i { display: block; height: 100%; width: 0; background: #0071e3; border-radius: 2px; }

  /* 按钮：Apple 风格胶囊 */
  .btn {
    margin: 16px auto 6px;
    display: block; cursor: pointer; user-select: none; width: 100%;
    font-family: inherit; font-size: 19px; font-weight: 600; letter-spacing: 2px;
    color: #fff;
    padding: 13px 0; border: none; border-radius: 980px;
    background: #0071e3;
    transition: background .15s, transform .08s, box-shadow .15s, opacity .15s;
  }
  .btn:hover { background: #0077ed; }
  .btn:active { transform: scale(.98); }
  .btn.stop { background: #3a3a3c; }
  .btn.stop:hover { background: #48484a; }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .hint { font-size: 12px; color: #86868b; text-align: center; margin-top: 8px; }

  /* 中奖名单 */
  .results { margin-top: 20px; }
  .results-title { font-size: 14px; font-weight: 600; color: #1d1d1f; margin-bottom: 8px; }
  #winners { display: flex; flex-direction: column; gap: 6px; }
  .winner {
    display: flex; align-items: center; gap: 10px;
    background: #f5f5f7; border: 1px solid #e8e8ed; border-radius: 12px;
    padding: 8px 12px;
    opacity: 0; transform: translateY(8px);
    animation: pop .35s ease forwards;
  }
  @keyframes pop { to { opacity: 1; transform: none; } }
  .winner .chip {
    flex-shrink: 0; font-size: 12px; font-weight: 600; color: #fff;
    background: #0071e3; padding: 2px 10px; border-radius: 999px;
  }
  .winner .wname { font-size: 15px; font-weight: 500; }

  .statusline { font-size: 12px; color: #86868b; text-align: center; margin-top: 16px; }
  .statusline b { color: #1d1d1f; font-weight: 600; }
  .meta { font-size: 11px; color: #a1a1a6; text-align: center; margin-top: 14px; }

  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(16px);
    background: rgba(29,29,31,.94); color: #fff;
    border-radius: 12px; padding: 10px 18px; font-size: 13px; opacity: 0;
    transition: all .25s; z-index: 9; max-width: 84vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

    if (rolling || !pool.length || prizeIndex >= plan.length) return;
    rolling = true;

    timer = setInterval(() => { nameEl.textContent = pick(pool).name; }, 42);

    if (!rolling) return;
    rolling = false;
    clearInterval(timer);

    cdBar.style.transition = "none";
    cdBar.style.width = "0%";

      nameEl.textContent = pick(rollFrom).name;
      i++;

      setTimeout(decel, delay);

  function lockIn(name, label) {
    nameEl.textContent = name;
    nameEl.classList.remove("rolling");
    nameEl.classList.add("locked");

    renderStats();
    if (prizeIndex >= plan.length) finishAll();
    else resetButton();
  }

    btn.disabled = (prizeIndex >= plan.length) || !pool.length;

    if (!btn.disabled) statusEl.innerHTML = "名单剩余 <b>" + pool.length + "</b> 人，点击继续抽奖";

    winnersEl.innerHTML = "";

    nameEl.textContent = "全部开奖完成";
    nameEl.classList.remove("rolling");
    nameEl.classList.add("locked");
    btn.textContent = "全部开奖完成";
    btn.disabled = true;
    btn.classList.remove("stop");
    statusEl.innerHTML = "抽奖完成，共 <b>" + winners.length + "</b> 位中奖者";
  }

  function addWinner(label, name) {
    const div = document.createElement("div");
    div.className = "winner";
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = label;
    const wname = document.createElement("span");
    wname.className = "wname";
    wname.textContent = name;
    div.appendChild(chip);
    div.appendChild(wname);
    winnersEl.prepend(div);
  }

  btn.addEventListener("click", () => {
    if (rolling) stopRoll();
    else startRoll();
  });

  init();
})();
